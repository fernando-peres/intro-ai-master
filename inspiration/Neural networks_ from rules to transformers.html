<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
try{
/* ===== core: RNG, activations, MLP with backprop, datasets ===== */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const ACT={
  tanh:{f:x=>Math.tanh(x),d:a=>1-a*a},
  relu:{f:x=>x>0?x:0,d:a=>a>0?1:0},
  sigmoid:{f:x=>1/(1+Math.exp(-x)),d:a=>a*(1-a)},
  linear:{f:x=>x,d:a=>1}
};
class MLP{
  constructor(sizes,act,out,seed){
    this.sizes=sizes;this.act=act;this.out=out;this.W=[];this.b=[];this.gn=[];
    const r=rng(seed||1);
    for(let l=1;l<sizes.length;l++){
      const nin=sizes[l-1],nout=sizes[l];
      const sc=act==='relu'?Math.sqrt(2/nin):Math.sqrt(1.2/nin);
      this.W.push(Array.from({length:nout},()=>Array.from({length:nin},()=>gauss(r)*sc)));
      this.b.push(new Array(nout).fill(0));
    }
  }
  forward(x){
    const A=[x],L=this.W.length,f=ACT[this.act].f;
    for(let l=0;l<L;l++){
      const prev=A[l],W=this.W[l],b=this.b[l],z=new Array(W.length);
      for(let j=0;j<W.length;j++){let s=b[j];const w=W[j];for(let i=0;i<prev.length;i++)s+=w[i]*prev[i];z[j]=s;}
      if(l===L-1){
        if(this.out==='softmax'){let m=-1e9;for(const v of z)if(v>m)m=v;let S=0;const e=z.map(v=>{const q=Math.exp(v-m);S+=q;return q;});A.push(e.map(v=>v/S));}
        else if(this.out==='linear')A.push(z);
        else A.push(z.map(v=>1/(1+Math.exp(-v))));
      }else A.push(z.map(f));
    }
    return A;
  }
  trainBatch(X,Y,lr){
    const L=this.W.length,d=ACT[this.act].d;
    const gW=this.W.map(M=>M.map(r=>new Array(r.length).fill(0)));
    const gB=this.b.map(v=>new Array(v.length).fill(0));
    let loss=0;
    for(let n=0;n<X.length;n++){
      const A=this.forward(X[n]);
      let delta=A[L].map((a,j)=>a-Y[n][j]);               // dLoss/dz at output (CE + softmax/sigmoid)
      if(this.out==='softmax')loss-=Math.log(Math.max(A[L][Y[n].indexOf(1)],1e-9));
      else loss-=Y[n][0]*Math.log(Math.max(A[L][0],1e-9))+(1-Y[n][0])*Math.log(Math.max(1-A[L][0],1e-9));
      for(let l=L-1;l>=0;l--){                              // walk backwards
        const prev=A[l];
        for(let j=0;j<delta.length;j++){gB[l][j]+=delta[j];const g=gW[l][j];const dj=delta[j];for(let i=0;i<prev.length;i++)g[i]+=dj*prev[i];}
        if(l>0){
          const nd=new Array(prev.length);
          for(let i=0;i<prev.length;i++){let s=0;for(let j=0;j<delta.length;j++)s+=this.W[l][j][i]*delta[j];nd[i]=s*d(prev[i]);}
          delta=nd;
        }
      }
    }
    const k=lr/X.length;
    this.gn=gW.map(M=>{let s=0,c=0;for(const r of M)for(const v of r){s+=Math.abs(v);c++;}return s/c/X.length;});
    for(let l=0;l<L;l++){
      for(let j=0;j<this.W[l].length;j++){this.b[l][j]-=k*gB[l][j];const w=this.W[l][j],g=gW[l][j];for(let i=0;i<w.length;i++)w[i]-=k*g[i];}
    }
    return loss/X.length;
  }
  backward(A,delta){
    const L=this.W.length,d=ACT[this.act].d,gW=this.W.map(M=>M.map(r=>new Array(r.length).fill(0))),gB=this.b.map(v=>new Array(v.length).fill(0));
    let gIn=null;
    for(let l=L-1;l>=0;l--){
      const prev=A[l];
      for(let j=0;j<delta.length;j++){gB[l][j]+=delta[j];for(let i=0;i<prev.length;i++)gW[l][j][i]+=delta[j]*prev[i];}
      const nd=new Array(prev.length);
      for(let i=0;i<prev.length;i++){let q=0;for(let j=0;j<delta.length;j++)q+=this.W[l][j][i]*delta[j];nd[i]=l>0?q*d(prev[i]):q;}
      if(l===0)gIn=nd;else delta=nd;
    }
    return{gW,gB,gIn};
  }
  applyGrads(g,k){for(let l=0;l<this.W.length;l++)for(let j=0;j<this.W[l].length;j++){this.b[l][j]-=k*g.gB[l][j];const w=this.W[l][j],q=g.gW[l][j];for(let i=0;i<w.length;i++)w[i]-=k*q[i];}}
  evaluate(X,Y){
    let loss=0,ok=0;const L=this.W.length;
    for(let n=0;n<X.length;n++){
      const o=this.forward(X[n])[L];
      if(this.out==='softmax'){const k=Y[n].indexOf(1);loss-=Math.log(Math.max(o[k],1e-9));let am=0;for(let j=1;j<o.length;j++)if(o[j]>o[am])am=j;if(am===k)ok++;}
      else{const y=Y[n][0];loss-=y*Math.log(Math.max(o[0],1e-9))+(1-y)*Math.log(Math.max(1-o[0],1e-9));if((o[0]>0.5)===(y>0.5))ok++;}
    }
    return{loss:loss/X.length,acc:ok/X.length};
  }
  params(){let s=0;for(let l=0;l<this.W.length;l++)s+=this.W[l].length*this.W[l][0].length+this.b[l].length;return s;}
  exportObj(){return{format:'mlp-v1',sizes:this.sizes,act:this.act,out:this.out,W:this.W,b:this.b};}
  static from(o){const m=Object.create(MLP.prototype);m.sizes=o.sizes;m.act=o.act;m.out=o.out;m.W=o.W;m.b=o.b;m.gn=[];return m;}
}
/* ---- 2-D "playground" datasets ---- */
const FEATS={x:{l:'x',fn:(x,y)=>x},y:{l:'y',fn:(x,y)=>y},xy:{l:'x·y',fn:(x,y)=>x*y},x2:{l:'x²',fn:(x,y)=>x*x},y2:{l:'y²',fn:(x,y)=>y*y},sinx:{l:'sin(πx)',fn:(x,y)=>Math.sin(Math.PI*x)}};
const FORDER=['x','y','xy','x2','y2','sinx'];
function makeData(kind,n,seed,noise){
  const r=rng(seed),P=[];
  for(let i=0;i<n;i++){
    let x,y,c=i%2;
    if(kind==='xor'){x=r()*2-1;y=r()*2-1;x+=x>0?0.12:-0.12;y+=y>0?0.12:-0.12;x*=0.88;y*=0.88;c=x*y>0?1:0;}
    else if(kind==='circle'){const a=r()*6.2832,rad=c?r()*0.45:0.7+r()*0.3;x=rad*Math.cos(a);y=rad*Math.sin(a);}
    else if(kind==='moons'){const t=r()*Math.PI;x=c?1-Math.cos(t):Math.cos(t);y=c?0.5-Math.sin(t):Math.sin(t);x=(x-0.5)*0.65;y=(y-0.25)*0.9;}
    else if(kind==='spiral'){const t=0.1+0.9*r(),rad=t*0.95,ang=t*3*Math.PI+c*Math.PI;x=rad*Math.cos(ang);y=rad*Math.sin(ang);}
    else{const m=c?0.5:-0.5;x=m+gauss(r)*0.2;y=m+gauss(r)*0.2;}
    const sd=noise*0.5+(kind==='moons'?0.04:0);
    P.push({x:x+gauss(r)*sd,y:y+gauss(r)*sd,c});
  }
  return P;
}
/* ---- 8x8 digits, generated with shifts + noise ---- */
const GLYPHS=[
["..####..",".##..##.","##....##","##....##","##....##","##....##",".##..##.","..####.."],
["...##...","..###...","...##...","...##...","...##...","...##...","...##...",".######."],
["..####..",".##..##.","......##",".....##.","...##...","..##....",".##.....","########"],
[".#####..","##...##.",".....##.","...###..",".....##.",".....##.","##...##.",".#####.."],
["....##..","...###..","..####..",".##.##..","##..##..","########","....##..","....##.."],
["#######.","##......","##......","######..",".....##.",".....##.","##...##.",".#####.."],
["..####..",".##.....","##......","######..","##...##.","##...##.","##...##.",".#####.."],
["########","......##",".....##.","....##..","...##...","...##...","..##....","..##...."],
[".#####..","##...##.","##...##.",".#####..","##...##.","##...##.","##...##.",".#####.."],
[".#####..","##...##.","##...##.",".######.","......##",".....##.","....##..","..###..."]
];
const BASE=GLYPHS.map(g=>g.join('').split('').map(ch=>ch==='#'?1:0));
function makeDigit(c,r,noise,noShift){
  const sh=()=>{if(noShift)return 0;const q=r();return q<0.5?0:q<0.75?-1:1;};
  const dx=sh(),dy=sh(),out=new Array(64);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const sx=x-dx,sy=y-dy;
    let v=(sx>=0&&sx<8&&sy>=0&&sy<8)?BASE[c][sy*8+sx]:0;
    v=v?0.75+0.25*r():0;
    v+=gauss(r)*noise*0.5;
    if(r()<noise*0.12)v=1-v;
    out[y*8+x]=Math.max(0,Math.min(1,v));
  }
  return out;
}
function makeDigitSet(per,seed,noise,noShift){
  const r=rng(seed),X=[],Y=[],L=[];
  for(let k=0;k<per;k++)for(let c=0;c<10;c++){X.push(makeDigit(c,r,noise,noShift));const y=new Array(10).fill(0);y[c]=1;Y.push(y);L.push(c);}
  return{X,Y,L};
}

function makeLeads(n,seed){

  const S=Q.map(q=>K.map(k=>q.reduce((s,x,i)=>s+x*k[i],0)/Math.sqrt(dk)));
  const A=S.map((row,i)=>{const z=row.map((v,j)=>(causal&&j>i)?-Infinity:v/temp);let m=-Infinity;z.forEach(v=>{if(v>m)m=v;});const ex=z.map(v=>v===-Infinity?0:Math.exp(v-m)),sum=ex.reduce((a,b)=>a+b,0);return ex.map(v=>v/sum);});
  const O=A.map(a=>[0,1,2,3].map(d=>a.reduce((s,w,j)=>s+w*V[j][d],0)));
  return{Q,K,V,S,A,O};
}
function Mat({data,rowLabels,colLabels,cell=26,mode='div',fmt,onRow,selRow,maskUpper}){
  const R=data.length,C=data[0].length,L=rowLabels.every(x=>!x)?4:84,Tp=colLabels?34:0,W=L+C*cell+4,H=Tp+R*cell+4;
  let mx=1e-6;if(mode==='div')data.forEach(r=>r.forEach(v=>{if(isFinite(v))mx=Math.max(mx,Math.abs(v));}));
  const els=[];
  if(colLabels)colLabels.forEach((t,j)=>els.push(h('text',{key:'c'+j,x:L+j*cell+cell/2,y:Tp-6,textAnchor:'middle',className:'tick',transform:`rotate(-35 ${L+j*cell+cell/2} ${Tp-6})`},t)));
  data.forEach((row,i)=>{
    els.push(h('text',{key:'r'+i,x:L-6,y:Tp+i*cell+cell/2+4,textAnchor:'end',className:i===selRow?'wl b':'wl',style:onRow?{cursor:'pointer'}:null,onClick:onRow?()=>onRow(i):null},rowLabels[i]));
    row.forEach((v,j)=>{
      const masked=!isFinite(v),col=masked?[225,228,235]:(mode==='div'?divColor(0.5+0.5*v/mx):mix(LIGHT,BLUE,Math.min(1,v)));
      els.push(h('rect',{key:i+'-'+j,x:L+j*cell,y:Tp+i*cell,width:cell-1,height:cell-1,rx:3,fill:rgb(col),stroke:i===selRow?'var(--ink)':'none',strokeWidth:i===selRow?1.5:0,style:onRow?{cursor:'pointer'}:null,onClick:onRow?()=>onRow(i):null}));
      if(fmt&&cell>=26&&!masked)els.push(h('text',{key:'t'+i+'-'+j,x:L+j*cell+cell/2-0.5,y:Tp+i*cell+cell/2+3.5,textAnchor:'middle',style:{fontSize:cell>=30?10:9,fill:(mode==='seq'&&v>0.55)?'#fff':'#1f2430',pointerEvents:'none'}},fmt(v)));
    });
  });
  return h('svg',{width:W,height:H,className:'dw'},...els);
}

      h('div',{className:'formula'},'Attention(Q, K, V) = softmax( Q·Kᵀ / √d',h('sub',null,'k'),' + mask ) · V'),
      h('p',{className:'small'},'This page shows only that main function, stepping through it on a short text. Real models learn the weights W',h('sub',null,'Q'),', W',h('sub',null,'K'),', W',h('sub',null,'V'),' from billions of words; ',h('b',null,'here four heads are hand-set'),' to show the kinds of patterns heads typically learn (the value projections are random). Nothing is trained, and no next word is predicted. For that, see the interactive GPT-2 demo at poloclub.github.io/transformer-explainer.'),
      h('div',{className:'row'},h('span',{className:'lbl'},'Input text'),h('input',{type:'text',value:text,onChange:e=>setText(e.target.value),className:'txt',maxLength:90}),h('span',{className:'small'},'(first 12 words used)'))),
    h('section',{className:'card'},

      h('div',{className:'scrollx'},h(Mat,{data:E,rowLabels:tokens,colLabels:EL,cell:22,mode:'div'})),

        h('b',null,'Head '+(k+1)+' · '+hd.name),h(Mat,{data:all[k].A,rowLabels:tokens.map(()=>''),cell:Math.max(8,Math.floor(120/T)),mode:'seq'})))),
      h('p',{className:'small'},h('b',null,'Head '+(head+1)+': '),H.desc),
      h('div',{className:'qkv'},
        h('div',null,h('div',{className:'ct'},'Q = E·W_Q  (“what am I looking for?”)'),h(Mat,{data:R.Q,rowLabels:tokens,colLabels:['q₁','q₂','q₃','q₄'],cell:26,mode:'div',fmt:fm})),
        h('div',null,h('div',{className:'ct'},'K = E·W_K  (“what do I contain?”)'),h(Mat,{data:R.K,rowLabels:tokens,colLabels:['k₁','k₂','k₃','k₄'],cell:26,mode:'div',fmt:fm})),
        h('div',null,h('div',{className:'ct'},'V = E·W_V  (“what do I pass on?”)'),h(Mat,{data:R.V,rowLabels:tokens,colLabels:['v₁','v₂','v₃','v₄'],cell:26,mode:'div',fmt:fm})))),
    h('section',{className:'card'},

        h('label',{className:'chk'},h('input',{type:'checkbox',checked:causal,onChange:e=>setCausal(e.target.checked)}),'causal mask (GPT-style: no peeking ahead)'),
        h('span',{className:'lbl'},'Temperature '+temp.toFixed(1)),h('input',{type:'range',min:0.2,max:3,step:0.1,value:temp,onChange:e=>setTemp(+e.target.value)})),

          :h(Mat,{data:R.S.map((row,a)=>row.map((v,b)=>(causal&&b>a)?-Infinity:v)),rowLabels:tokens,colLabels:tokens,cell:T>8?30:36,mode:'div',fmt:v=>v.toFixed(1),onRow:setQi,selRow:i})),
        h('div',null,

          h('div',{className:'bars'},...R.A[i].map((a,j)=>h('div',{key:j,className:'bar'+(top[0].j===j?' top':''),style:{gridTemplateColumns:'64px 1fr 38px'}},h('span',{style:{textAlign:'right'}},tokens[j]),h('div',{className:'track'},h('div',{className:'fill',style:{width:(a*100)+'%'}})),h('em',null,pct(a))))),
          h('div',{className:'code'},'output(“'+tokens[i]+'”) = Σⱼ aᵢⱼ · vⱼ\n= '+top.filter(t=>t.a>0.005).map(t=>f2(t.a)+'·v('+tokens[t.j]+')').join(' + ')+(R.A[i].filter(a=>a>0.005).length>3?' + …':'')+'\n= ['+R.O[i].map(v=>sg(v)).join(', ')+']'))),
      h('p',{className:'small'},'Every row sums to 1 (softmax). The output for each token is a weighted average of the value vectors: information is copied from the tokens it attends to. In a real model this happens in many heads at once, in every layer.')),
    h('section',{className:'card'},
      h('h3',null,'Where attention sits in the full architecture'),
      h('div',{className:'stack'},
        blk('Input tokens','“'+tokens.slice(0,4).join(' ')+(T>4?' …':'')+'” → integer ids (sub-word tokenizer)'),h('div',{className:'arr v'},'↓'),
        blk('Token embedding + positional encoding','vector per token (here 18 numbers; GPT-2: 768)'),h('div',{className:'arr v'},'↓'),
        h('div',{className:'loop'},h('div',{className:'looplbl'},'Transformer block  ×N  (GPT-2 small: 12)'),

          blk('Add & LayerNorm','residual connection: x + Attention(x)'),h('div',{className:'arr v'},'↓'),
          blk('Feed-forward network','Linear → GELU → Linear, applied to each token separately (holds much of the “knowledge”)'),h('div',{className:'arr v'},'↓'),

      {t:'Positional encoding',d:'Attention itself ignores order, so we add sin/cos waves of different frequencies per position. Shifting by one step is a simple rotation of these waves, which Head 1 exploits.',live:'PE(p, 2m) = sin(ω_m·p),  PE(p, 2m+1) = cos(ω_m·p)'},

      {t:'Scaled dot-product',d:'Score(i,j) = q_i · k_j / √d_k. Dividing by √d_k stops large dot products from saturating the softmax.',live:`score(${tokens[i]}→${tokens[top[0].j]}) = ${f2(R.S[i][top[0].j],2)}`},

      {t:'Causal mask',d:'Decoder models (GPT) must not see the future when predicting the next word, so scores for j > i are set to −∞ before softmax.',live:causal?'mask ON: upper triangle = 0':'mask OFF (bidirectional, like BERT)'},

    {y:'1997',t:'LSTM',s:'gated memory for sequences',lim:'Limit: sequential, slow'},
    {y:'2012 →',t:'Deep learning',s:'features learned from raw pixels',lim:'Train · export · deploy'},
