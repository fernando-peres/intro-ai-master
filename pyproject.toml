[project]
name = "intro-ai-master"
version = "0.1.0"
description = "Monorepo root: apps/* and packages/* (uv workspace)."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.1"]
notebooks = [
    "ipykernel>=7.4",
    "mcp>=2.3",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/all-apps", "apps/algo-server", "apps/harness-content-api", "packages/algo", "packages/genai"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/all-apps/tests", "apps/algo-server/tests", "apps/harness-content-api/tests", "packages/algo/tests", "packages/genai/tests"]
markers = ["slow: downloads and runs real models (GPT-2, GloVe, MiniLM)"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.importlinter]
root_packages = ["algo", "algo_server", "all_apps", "genai", "harness_content_api"]

[[tool.importlinter.contracts]]
name = "packages/* never import apps/*"
type = "forbidden"
source_modules = ["algo", "genai"]
forbidden_modules = ["algo_server", "all_apps", "harness_content_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["algo", "algo_server", "all_apps", "genai", "harness_content_api"]
