[project]
name = "blocks"
version = "0.1.0"
description = "Streamlit app that serves the interactive HTML notes (one per building block) behind a login."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["streamlit>=1.50"]

[project.scripts]
blocks = "blocks.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blocks"]
