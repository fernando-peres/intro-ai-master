[project]
name = "all-apps"
version = "0.1.0"
description = "Terminal dashboard to run, stop and watch every service in the monorepo."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["textual>=1.0", "pyte>=0.8", "psutil>=6", "httpx>=0.27"]

[project.scripts]
all-apps = "all_apps.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/all_apps"]
