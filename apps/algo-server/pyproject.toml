[project]
name = "algo-server"
version = "0.1.0"
description = "FastAPI service."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi[standard]>=0.115", "algo", "genai[gpt2]", "python-dotenv>=1.0"]

[tool.uv.sources]
algo = { workspace = true }
genai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_server"]
