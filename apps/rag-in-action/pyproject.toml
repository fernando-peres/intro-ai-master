[project]
name = "rag-in-action"
version = "0.1.0"
description = "Streamlit app that runs a RAG pipeline step by step over an authored Markdown corpus."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.50",
    "faiss-cpu>=1.12",
    "plotly>=6.0",
    "pandas>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "genai[embeddings]",
]

[project.scripts]
rag-in-action = "rag_in_action.main:main"

[tool.uv.sources]
genai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_in_action"]
