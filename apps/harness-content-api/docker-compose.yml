name: harness-sigma

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "5433:5432"
    volumes:
      - harness-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  harness-pg:
