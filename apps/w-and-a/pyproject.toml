[project]
name = "w-and-a"
version = "0.1.0"
description = "Streamlit app: the same question answered by a chatbot, a single prompt, a workflow, an agent and an agentic system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.50",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
w-and-a = "w_and_a.main:main"
w-and-a-record = "w_and_a.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/w_and_a"]
