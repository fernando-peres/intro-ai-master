[project]
name = "genai"
version = "0.1.0"
description = "Generative AI teaching models: GPT-2 base model, prompt builders, chat assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["openai>=1.50"]

[project.optional-dependencies]
gpt2 = ["torch>=2.9", "transformers>=4.57"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai"]
