[project]
name = "genai"
version = "0.1.0"
description = "Generative AI teaching models: GPT-2 base model, prompt builders, chat assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["openai>=1.50"]

[project.optional-dependencies]
gpt2 = ["torch>=2.9", "transformers>=4.57"]
embeddings = [
    "sentence-transformers>=5.1",
    "numpy>=2.3",
    "safetensors>=0.5",
    "huggingface-hub>=0.34",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai"]
