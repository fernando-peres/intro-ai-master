function loopPlayer(attempts, final, request) {

    const v = r[2].toLowerCase();
    steps.push({ n: ["judge"], a: [v === "pass" ? "pass" : "fail"], t: `Attempt ${r[0]}: the judge says ${v}`, tone: v, body: `<div class="ocard ${v}"><b>Critique</b>${esc(r[3])}</div>` });
    if (v !== "pass" && k < attempts.length - 1) steps.push({ n: ["fix"], a: ["retry"], t: "Change the instruction, then call again", body: "<p class='sub'>Retrying with the same instruction mostly gets the same result. This loop feeds the critique back in.</p>" });
  });

    <div class="cap"></div></div>` };
}
const LOOPS = new Map();
function wireLoop(p) {
  const root = document.getElementById(p.id); if (!root) return;
  let k = 0, timer = null;
  const set = n => {
    k = n; const s = p.steps[k];
    $$(".lnode", root).forEach(g => g.classList.toggle("on", s.n.includes(g.dataset.n)));
    $$(".larr", root).forEach(g => g.classList.toggle("on", s.a.includes(g.dataset.a)));
    $$(".lprog i", root).forEach((el, i) => el.classList.toggle("on", i <= k));
    $(".cap", root).innerHTML = `<div class="t"><span class="badge">${k + 1}</span>${esc(s.t)}${s.tone ? " " + vchip(s.tone === "pass" ? "pass" : "fail") : ""}</div>${s.body || ""}`;
  };
  const stop = () => { clearInterval(timer); timer = null; $("[data-lp=play] span", root).textContent = "Play"; };
  root.addEventListener("click", ev => {
    const b = ev.target.closest("[data-lp]"); if (!b) return;
    const a = b.dataset.lp;
    if (a === "play") { if (timer) return stop(); if (k >= p.steps.length - 1) set(0); $("[data-lp=play] span", root).textContent = "Pause"; timer = setInterval(() => { if (k >= p.steps.length - 1) return stop(); set(k + 1); }, 2200); }
    if (a === "step") { stop(); set(Math.min(p.steps.length - 1, k + 1)); }
    if (a === "back") { stop(); set(Math.max(0, k - 1)); }
    if (a === "reset") { stop(); set(0); }
  });
  LOOPS.set(p.id, stop);
  set(0);
}

    } },
    { short: "Can't succeed", part: "Scenario 5", player(b, cells) { const i = b.find(cells, "no_data_request"); return loopPlayer(attemptsIn(b, i), b.cards(i).pop(), quoted(b, i, /no_data_request = "([^"]+)"/)); }, visual(b, cells) {
      const i = b.find(cells, "no_data_request"); return `<div class="ocard fail"><b>Cost of a request that can't pass</b>${esc(b.stream(i).trim())}</div>`;
    } },
    { short: "The judge is wrong", part: "Scenario 6", visual(b, cells) {
      const i = b.find(cells, "fine_request"), t = b.table(i), w = t[1];
      const rows = t.slice(2).map(r => [r[0], cellH(fmtCell(r[1])), cellH(esc(r[2]))]);
      return `<div class="twocol">${visPanel("A strict judge made the reply worse", "Words in the reply, before and after the loop pleased the strict judge.", barsHtml([{ name: "First draft", val: +w[1], max: Math.max(+w[1], +w[2]), tone: "pass", label: `${w[1]} words` }, { name: "Final draft (mean)", val: +w[2], max: Math.max(+w[1], +w[2]), tone: "warn", label: `${w[2]} words` }]))}
        ${visPanel("Graded by an independent judge", "The original short answer was fine.", vTable(["Measure", "First draft", "Final drafts"], rows))}</div>`;
    } },
    { short: "Compare strategies", part: "Comparing the strategies", visual(b, cells) {
      const t = b.table(b.find(cells, "PARTIAL_POLICY = "));
      return `<div class="twocol">${visPanel("Passes, graded twice", "Working judge (inside the loop) and held-out judge (never seen by the loop).", `<div class="bars">${t.slice(1).map(r => { const a = frac(r[1]), c = frac(r[2]); return `<div class="bar-row two"><span class="name">${esc(r[0])}</span><div style="display:grid;gap:4px"><div class="bar-track" style="height:12px"><div class="bar-fill done" data-w="${(100 * a[0]) / a[1]}"></div></div><div class="bar-track" style="height:12px"><div class="bar-fill pass" data-w="${(100 * c[0]) / c[1]}"></div></div></div><span class="val">${esc(r[1])} · ${esc(r[2])}</span></div>`; }).join("")}</div><div class="legend">${chip("working judge", "info")}${chip("held-out judge", "ok")}</div>`)}
        ${visPanel("What it costs", "Mean model calls per request (generate + judge).", barsHtml(t.slice(1).map(r => ({ name: r[0], val: +r[4], max: Math.max(...t.slice(1).map(x => +x[4])), tone: "warn", label: r[4] }))))}</div>`;
    } },
  ],
};

/* ---------------------------------------------------------- 04 experiment */
function forestSvg(rows) {
  const W = 760, L = 150, R = 150, H = 34 * rows.length + 40, x = v => L + ((W - L - R) * v) / 100;
  const best = Math.max(...rows.map(r => r.p));
  return `<svg class="forest" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pass rate with 95% interval per variant">
    <g class="grid">${[0, 25, 50, 75, 100].map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="10" y2="${H - 24}"/><text x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}%</text>`).join("")}</g>
    ${rows.map((r, k) => { const y = 30 + 34 * k; return `<g class="row${r.p === best ? " best" : ""}"><text x="${L - 14}" y="${y + 4}" text-anchor="end">${esc(r.name)}</text><line x1="${x(r.lo)}" x2="${Math.max(x(r.hi), x(r.lo) + 0.1)}" y1="${y}" y2="${y}"/><circle cx="${x(r.p)}" cy="${y}" r="7"/><text class="v" x="${W - R + 14}" y="${y + 4}">${r.p}% (${r.lo}–${r.hi})</text></g>`; }).join("")}
  </svg>`;
}
const ciRows = t => t.slice(1).map(r => { const m = r.find(v => / to /.test(v)).match(/(\d+)% to (\d+)%/); return { name: r[0], p: pct(r[1]), lo: +m[1], hi: +m[2] }; });
function heatHtml(t) {
  const cls = v => { const p = pct(v); return p === null ? "" : p >= 90 ? "h3" : p >= 60 ? "h2" : "h1"; };
  return vTable(t[0], t.slice(1).map(r => r.map((v, k) => (k ? cellH(esc(v), `hv ${cls(v)}`) : v))), "heat");
}
SPEC.experiment = {
  title: "Experiment",
  concepts(b) {
    const hyp = b.span("1. Hypothesis");
    return `<div class="panel pad md">${hyp.map(i => mdBlock(stripHeads(b.cells[i]))).join("")}</div>
      <div class="anatomy"><div class="st"><b>Hypothesis</b><span>written before running</span></div><span class="ar">→</span><div class="st"><b>Dataset</b><span>segments, dev and test</span></div><span class="ar">→</span>
        <div class="st"><b>Variants</b><span>same output structure</span></div><span class="ar">→</span><div class="st"><b>Scorers</b><span>code first, then a judge</span></div><span class="ar">→</span>
        <div class="st hot"><b>Statistics</b><span>intervals, paired tests</span></div><span class="ar">→</span><div class="st"><b>Decision</b><span>confirmed on test</span></div></div>`;
  },
  setup: b => [[b.all("load_dotenv(find_dotenv"), "Setup: run stamp, client, helpers"]],
  teaser(b) { return visPanel("Pass rate on the dev split, with 95% intervals", "Bootstrap over cases. Overlapping intervals: don't read much into small gaps.", forestSvg(ciRows(b.table(b.all("def by_case"))))); },
  tabs: [
    { short: "Dataset", part: "2. The dataset", visual(b, cells) {
      const t = b.table(b.find(cells, "POLICY_SECTIONS")), dev = t.slice(1).reduce((a, r) => a + +r[1], 0), test = t.slice(1).reduce((a, r) => a + +r[2], 0);
      return `<div class="stats" style="margin-bottom:14px">${stat("Dev cases", dev, "", "compare and read failures")}${stat("Test cases", test, "", "untouched until the end")}${stat("Segments", t.length - 1)}</div>`
        + visPanel("Cases per segment", "Most failures live in the hard segments, and an average would hide them.", barsHtml(t.slice(1).map(r => ({ name: r[0], val: +r[1] + +r[2], max: Math.max(...t.slice(1).map(x => +x[1] + +x[2])), tone: "done", label: `${r[1]} dev · ${r[2]} test` }))));
    } },
    { short: "Variants & scorers", part: "3. The variants", noOutput: true, visual(b) {
      const sc = b.span("4. The scorers"), i = b.find(sc, '_case = {c["id"]');
      return `<div class="ocard pass"><b>The scorers are tested first</b>${esc(b.stream(i).trim())}</div>` + `<div class="subhead">4 · The scorers</div>` + walkHtml(b, sc);
    } },
    { short: "Results", part: "5. Run the experiment", to: "By segment", visual(b, cells) {
      const i = b.find(cells, "def by_case"), t = b.table(i);
      return visPanel("Pass rate with a 95% interval", "Each variant ran every dev case three times. Intervals come from resampling the cases.", forestSvg(ciRows(t)))
        + visPanel("Cost of each variant", "Better isn't free: compare tokens and latency too.", vTable(t[0], t.slice(1)));
    } },
    { short: "By segment", part: "5. Run the experiment", from: "By segment", visual(b, cells) {
      return visPanel("Pass rate by segment", "An average can hide a variant that is excellent on easy cases and dangerous on adversarial ones.", heatHtml(b.table(b.find(cells, "def segment_rows"))));
    } },
    { short: "Is it real?", part: "5. Run the experiment", from: "McNemar", visual(b, cells) {
      const i = b.find(cells, "def majority"), t = b.table(i);
      return visPanel("McNemar's test: only the cases where the variants disagree count", oneLine(b.stream(i)), vTable(t[0], t.slice(1).map(r => r.map((v, k) => (k === 3 ? cellH(chip(v, +v < 0.05 ? "ok" : "mute")) : v)))) + `<p class="note"><span class="badge">!</span>p &lt; 0.05 is shown in green. With several comparisons, one low p-value is weaker evidence than it looks.</p>`);
    } },
    { short: "Failures", part: "5. Run the experiment", from: "Read the failures", visual(b, cells) {
      const i = b.find(cells, "def failure_kind"), t = b.table(i);
      return visPanel("What went wrong, by variant", "Counts of each failure kind. The numbers rank; the failures show what to change.", vTable(t[0], t.slice(1).map(r => r.map((v, k) => (k ? cellH(+v ? chip(v, "bad") : `<span style="color:var(--ink3)">0</span>`) : v)))));
    } },
    { short: "Agent tool use", part: "5. Run the experiment", from: "tool use", visual(b, cells) {
      const i = b.find(cells, "answer_runs = "), t = b.table(i);
      return visPanel("Did the agent read the policy before answering?", oneLine(b.stream(i)), barsHtml(t.slice(1).map(r => ({ name: r[0], val: +r[1], max: Math.max(...t.slice(1).map(x => +x[1])), tone: "done", label: `${r[1]} reads` }))));
    } },
    { short: "Confirm on test", part: "6. Improve", visual(b, cells) {
      const i = b.find(cells, "FINALISTS = "), t = b.table(i, 0), seg = b.table(i, 1);
      return `<div class="twocol">${visPanel("Dev vs. test", "A drop from dev to test suggests tuning to the dev cases.", barsHtml(t.slice(1).flatMap(r => [{ name: `${r[0]} · dev`, val: pct(r[1]), max: 100, tone: "done", label: r[1] }, { name: `${r[0]} · test`, val: pct(r[2]), max: 100, tone: "pass", label: `${r[2]} (${r[3]})` }])))}
        ${visPanel("Test split by segment", oneLine(b.stream(i).split("\n").filter(l => /McNemar/.test(l)).join(" ")), heatHtml(seg))}</div>`;
    } },
    { short: "Conclusion", part: "7. Conclusion", visual(b, cells) {
      const c = b.cards(b.find(cells, "dev_p = mcnemar"))[0];
      return c ? `<div class="ocard pass"><b>${esc(c.title)}</b>${esc(c.body)}</div>` : "";
    } },
  ],
};
</script>
<script>
/* =====================================================================
   page rendering
   ===================================================================== */
const ORDER = ["llm_judge", "judge_scenarios", "judge_loop", "experiment"].filter(k => BOOKS[k]);
const state = { sel: {} };
const firstSentence = s => { const t = oneLine(String(s).replace(/\*\*/g, "")); const m = t.match(/^(.+?[.!?])(\s|$)/); return m ? m[1] : t; };
const tabTitle = (b, s, cells) => {
  if (s.from) { const l = b.cells[cells[0]].split("\n").find(x => x.startsWith("## ") && x.includes(s.from)); if (l) return l.replace(/^## /, ""); }
  return b.cells[cells[0]].match(/^#\s+(.+)$/m)[1];
};
const safe = (fn, what) => { try { return fn(); } catch (e) { console.error(e); return `<p class="note"><span class="badge">!</span>${esc(what)}: ${esc(e.message)}</p>`; } };

function takeaways(b) {
  const tc = b.ids.find(i => b.isPart(i) && /^#\s+(Takeaways|Conclusion)\s*$/m.test(b.cells[i]));
  let items = [];
  if (tc !== undefined) items = b.cells[tc].split("\n").filter(l => /^\d+\. /.test(l)).map(l => l.replace(/^\d+\. /, ""));
  if (!items.length) { const w = b.ids.find(i => b.isMd(i) && /^## What to take from this/m.test(b.cells[i])); if (w !== undefined) items = b.cells[w].split("\n").filter(l => l.startsWith("- ")).map(l => l.slice(2)); }
  return items.map(l => { const m = l.match(/^\*\*(.+?)\*\*\s*(.*)$/); return m ? { h: m[1], p: m[2] } : { h: l, p: "" }; });
}

function renderBook(key) {
  const b = BOOKS[key], spec = SPEC[key], head = b.cells[b.ids[0]];
  const title = head.match(/^#\s+(.+)$/m)[1], quote = (head.match(/^>\s*(.+)$/m) || [])[1] || "";
  const items = head.split("\n").filter(l => /^\d+\. /.test(l)).map(l => l.replace(/^\d+\. /, ""));
  const id = s => `${key}-${s}`;
  const tabs = spec.tabs.map(s => { let cells = []; try { cells = b.span(s.part, s.from, s.to); } catch (e) { console.error(e); } return { ...s, cells }; });
  const tk = takeaways(b);
  const nav = [["concepts", "Concepts"], ["code", "Core code"], ["tabs", "Step by step"]];
  if (tk.length) nav.push(["takeaways", "Takeaways"]);

  let html = `<section id="${id("top")}"><div class="panel hero">
    <div><div class="section-head"><span class="badge">nb</span><span class="kicker">${esc(b.file)}</span></div>
      <h1>${md(title)}</h1><p class="quote">${md(quote)}</p>
      <div class="chips">${items.map((t, i) => `<a class="chip" href="#${id(i === 0 ? "concepts" : "tabs")}"><span class="badge">${i + 1}</span>${md(t)}</a>`).join("")}</div></div>
    <div class="teaser">${safe(() => spec.teaser(b), "Teaser")}</div></div></section>`;

  html += `<section id="${id("concepts")}"><div class="section-head"><span class="kicker">01 · Concepts</span></div><h2>The idea</h2>${safe(() => spec.concepts(b), "Concepts")}</section>`;

  const scen = b.ids.find(i => b.isMd(i) && /^### The scenario|Harbor Cycles/.test(b.cells[i]) && !b.isPart(i) && !/^## /m.test(b.cells[i]));
  html += `<section id="${id("code")}"><div class="section-head"><span class="kicker">02 · Core code</span></div><h2>The setup</h2>
    ${scen !== undefined ? `<div class="panel pad md">${mdBlock(stripHeads(b.cells[scen]))}</div>` : ""}
    ${safe(() => spec.setup(b).map(([c, l]) => codeBlock(b, c, l)).join(""), "Setup")}</section>`;

  html += `<section id="${id("tabs")}"><div class="section-head"><span class="kicker">03 · Step by step</span></div>
    <h2>${tabs.length} steps through the notebook</h2>
    <p class="lede">Pick a tab. Each shows what the saved run measured, then the notebook's own cells and outputs in order.</p>
    <div class="tabs" role="tablist" id="${id("tabbar")}">${tabs.map((s, i) => `<button class="tab" role="tab" aria-selected="false" data-tab="${i}"><span class="badge">${i + 1}</span><span>${esc(s.short)}<small>${esc(trunc(s.cells.length ? tabTitle(b, s, s.cells).replace(/^(Example|Scenario|Part) \d+:\s*|^\d+\.\s*/, "") : "", 40))}</small></span></button>`).join("")}</div>
    <div id="${id("panel")}"></div></section>`;

  if (tk.length) html += `<section id="${id("takeaways")}"><div class="section-head"><span class="kicker">Takeaways</span></div><h2>Takeaways</h2><div class="takeaways">${tk.map((t, i) => `<div class="panel tk"><span class="num">0${i + 1}</span><h3>${md(t.h)}</h3><p>${md(t.p)}</p></div>`).join("")}</div></section>`;
  return { html, nav, tabs, title };
}

const BUILT = {};
function selectTab(key, i, { scroll = false } = {}) {
  LOOPS.forEach(stop => stop()); LOOPS.clear();
  const b = BOOKS[key], s = BUILT[key].tabs[i], panel = $(`#${key}-panel`);
  state.sel[key] = i;
  $$(`#${key}-tabbar .tab`).forEach(t => t.setAttribute("aria-selected", String(+t.dataset.tab === i)));
  if (!s.cells.length || (!s.noOutput && !s.cells.some(c => b.ran(c)))) {
    panel.innerHTML = `<div class="ex">${notRun(b, s.short)}${s.cells.length ? walkHtml(b, s.cells) : ""}</div>`;
    applyCodeAll(); return;
  }
  const raw = b.cells[s.cells[0]], cut = raw.search(/\n---\s*\n#\s/);
  const intro = stripHeads(cut > 0 ? raw.slice(cut) : raw);
  const player = s.player ? (() => { try { return s.player(b, s.cells); } catch (e) { console.error(e); return null; } })() : null;
  panel.innerHTML = `<div class="ex" role="tabpanel">
    <div class="ex-head"><div><span class="gap-tag">Step ${i + 1} of ${BUILT[key].tabs.length}</span><h2>${esc(tabTitle(b, s, s.cells))}</h2></div></div>
    ${intro ? `<div class="ex-intro md">${mdBlock(intro)}</div>` : ""}
    ${player ? `<div class="subhead">Replay the loop</div>${player.html}` : ""}
    ${s.visual ? `<div class="subhead">What the run shows</div>${safe(() => s.visual(b, s.cells), s.short)}` : ""}
    <div class="subhead">In the notebook</div>${walkHtml(b, s.cells.slice(1))}
  </div>`;
  if (player) wireLoop(player);
  applyCodeAll();
  requestAnimationFrame(() => requestAnimationFrame(() => $$("[data-w]", panel).forEach(el => (el.style.width = el.dataset.w + "%"))));
  history.replaceState(null, "", `#${key}/${i + 1}`);
  if (scroll) $(`#${key}-tabs`).scrollIntoView();
}

function selectBook(key, { tab, scroll = false } = {}) {
  $$(".booktab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.book === key)));
  $$(".book").forEach(el => (el.hidden = el.dataset.book !== key));
  const R = BUILT[key];
  $("#subnav").innerHTML = R.nav.map(([s, t]) => `<a href="#${key}-${s}" data-sid="${key}-${s}">${esc(t)}</a>`).join("");
  document.title = `${SPEC[key].title} · Evals · Interactive notes`;
  selectTab(key, tab ?? state.sel[key] ?? 0);
  if (scroll) window.scrollTo({ top: 0 });
  observeNav(key);
}

let io;
function observeNav(key) {
  if (io) io.disconnect();
  const links = $$("#subnav a");
  io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle("on", a.dataset.sid === en.target.id)); }), { rootMargin: "-35% 0px -60% 0px" });
  $$(`.book[data-book="${key}"] section[id]`).forEach(s => io.observe(s));
}

/* ---------- boot ---------- */
$("#booktabs").innerHTML = ORDER.map((k, i) => `<button class="booktab" role="tab" aria-selected="false" data-book="${k}"><span class="badge">0${i + 1}</span>${SPEC[k].title}</button>`).join("");
$("#main").innerHTML = ORDER.map(k => `<div class="book" data-book="${k}" hidden></div>`).join("");
for (const k of ORDER) {
  const R = renderBook(k);
  BUILT[k] = R;
  const host = $(`.book[data-book="${k}"]`);
  host.innerHTML = R.html;
  $$("[data-w]", host).forEach(el => (el.style.width = el.dataset.w + "%"));
  host.addEventListener("click", ev => {
    const crit = ev.target.closest("[data-crit]");
    if (crit) { const r = $(`tr[data-c="${crit.dataset.crit}"]`, host); r.hidden = !r.hidden; crit.closest("tr").classList.toggle("row-open", !r.hidden); return; }
    const t = ev.target.closest("[data-tab]");
    if (t) selectTab(k, +t.dataset.tab, { scroll: !t.classList.contains("tab") });
  });
}
$("#booktabs").addEventListener("click", ev => { const t = ev.target.closest(".booktab"); if (t) selectBook(t.dataset.book, { scroll: true }); });

/* global: code toggle, copy, theme */
let codeAll = false;
function applyCodeAll() { $$("details.code").forEach(d => (d.open = codeAll)); }
$("#codeAll").addEventListener("click", () => {
  codeAll = !codeAll; applyCodeAll();
  $("#codeAll").setAttribute("aria-pressed", String(codeAll));
  $("#codeAll .t").textContent = codeAll ? "Hide all code" : "Show all code";
});
document.addEventListener("click", ev => {
  const bt = ev.target.closest(".copy"); if (!bt) return;
  ev.preventDefault(); ev.stopPropagation();
  navigator.clipboard?.writeText(BOOKS[bt.dataset.book].cells[bt.dataset.cell]).then(() => { bt.textContent = "Copied"; setTimeout(() => (bt.textContent = "Copy"), 1200); });
});
let savedTheme = null; try { savedTheme = localStorage.getItem("evals-theme"); } catch (e) {}
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem("evals-theme", t); } catch (e) {} };
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* deep links: #book or #book/<tab number> */
function fromHash() {
  const [bk, n] = location.hash.slice(1).split("/");
  if (!BOOKS[bk]) return selectBook(ORDER[0]);
  const i = n ? +n - 1 : -1;
  selectBook(bk, { tab: i >= 0 && i < BUILT[bk].tabs.length ? i : undefined });
  if (i >= 0) $(`#${bk}-tabs`).scrollIntoView();
}
fromHash();
window.addEventListener("hashchange", () => { if (/^#\w+(\/\d+)?$/.test(location.hash) && BOOKS[location.hash.slice(1).split("/")[0]]) fromHash(); });
</script>
</body>
</html>
